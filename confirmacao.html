<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compra Confirmada - Samuel Cars</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #000; /* Fundo preto */
            color: #fff; /* Texto branco */
        }
        h1 {
            font-size: 2rem;
            margin-bottom: 20px;
        }
        .sucesso {
            color: #00ff00; /* Verde destaque */
            font-weight: bold;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }
        .mensagem {
            font-size: 1.1rem;
            color: #ccc; /* Texto levemente cinza */
            max-width: 600px;
            margin: 0 auto 30px;
            line-height: 1.6;
        }
        .btn-voltar {
            display: inline-block;
            padding: 12px 25px;
            background-color: #1a73e8; /* Azul */
            color: white;
            text-decoration: none;
            font-weight: bold;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        .btn-voltar:hover {
            background-color: #0056b3; /* Azul mais escuro no hover */
        }
    </style>
</head>
<body>

    <h1 id="nome-carro"></h1>
    <p class="sucesso">Comprado com sucesso!</p>
    <p class="mensagem">
        Parabéns pela sua compra! Ele será encaminhado para o seu local de endereço que já está salvo no nosso banco de dados. 
        Caso queira ver mais opções, aperte no botão abaixo.
    </p>

    <!-- Botão para voltar -->
    <a href="carros.html" class="btn-voltar">Ver mais carros</a>

    <script>
        // Pega o nome do carro da URL
        const params = new URLSearchParams(window.location.search);
        const nomeCarro = params.get('carro');

        // Mostra o nome do carro na página
        document.getElementById('nome-carro').textContent = nomeCarro;
    </script>

</body>
</html>
